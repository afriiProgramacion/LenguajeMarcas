<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ejercicio32802.css">
    <script type="module" src="ejercicio32802.js"></script>
    <title>Calculadora</title>
  </head>


  <body>
      <h1 id="titulo">CALCULADORA</h1>
      
      <div class="contenedor">
        <div class="calculadora">
      <!-- Pantalla de la calculadora.
            type="text" - indica que es un campo de texto.
            disable - indica que el usuario no puede escribir en él. -->
      <input type="text" id="pantalla" disabled>


      <div class="botones">


        <!-- Botones de la calculadora.
              type="button" - indica que es un botón que no envía los datos
                                       de un formulario, es un botón controlado por
                                       JavaScript.
              value="7" - Valor asignado el botón, es lo que JavaScript recibe
                                 al pulsar el botón.
                                 >7< - Contenido visible del botón en el navegador.  -->
        
        
        
        <button type="button" class="btn" value="4">4</button>
        <button type="button" class="btn" value="5">5</button>
        <button type="button" class="btn" value="6">6</button>
        <button type="button" class="btn" value="7">7</button>
        <button type="button" class="btn" value="8">8</button>
        <button type="button" class="btn" value="9">9</button>
        <button type="button" class="btn" value="0">0</button>
        <button type="button" id="CE" class="btn op">CE</button>
        <button type="button" class="btn op" value="/">÷</button>
        <button type="button" class="btn op" value="%">%</button>
        <button type="button" class="btn" value="1">1</button>
        <button type="button" class="btn" value="2">2</button>
        <button type="button" class="btn" value="3">3</button>
        <button type="button" class="btn" value=".">.</button>
        <button type="button" class="btn op" value="-">−</button>
        <button type="button" class="btn op" value="*">×</button>
        <button type="button" class="btn op" value="+">+</button>
        <button type="button" class="btn op" id="cambio" value="">+/-</button>
        <button type="button" class="btn op" value="**">^</button>
        
        <button type="button" id="igual" class="btn">=</button>
        <button type="button" id="limpiar" class="btn">C</button>
      </div>
      </div>
      
      <div id="color">
        <div id="colorInput">
          <button type="button" id="btnCambiarColor" class="cambiarcolor">Cambiar color de los números</button>
          <input type="color" id="selectorColor" value="#2ecc71">
        </div>
        <button type="button" id="btnCambiarEstilo" class="cambiarcolor">Cambiar estilo del título</button>
        <button type="button" id="btnCambiarTeclas" class="cambiarcolor">Cambiar estilo de las teclas</button>
        <button type="button" id="btnOperacionesEspeciales" class="cambiarcolor">Activar / Desactivar operaciones especiales</button>
      </div>
  </body>
</html>
