<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo HTML</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0b3d91, #0b6d91);
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
      letter-spacing: 0.02em;
    }
    p {
      line-height: 1.6;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
      background: #ffd500;
      color: #0b3d91;
      font-weight: 700;
      transition: transform 120ms ease, box-shadow 120ms ease;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 25px rgba(0, 0, 0, 0.3);
    }
    button:active {
      transform: translateY(0);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
    }
    .status {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <article class="card">
    <h1>¡Hola! 🌟</h1>
    <p>Este es un ejemplo sencillo de una página HTML generada automáticamente. Puedes cambiar el texto, añadir más secciones o usarla como base para tus prácticas.</p>

    <p>Haz clic en el botón para ver una frase aleatoria:</p>
    <button id="randomBtn" type="button">Mostrar frase</button>

    <div class="status" id="status">Haz clic en el botón para comenzar.</div>
  </article>

  <script>
    const frases = [
      'La curiosidad nos lleva a grandes descubrimientos.',
      'La práctica hace al maestro.',
      'El código limpio es un acto de cortesía.',
      'Cada error es una oportunidad para aprender.',
      '¡Nunca dejes de experimentar!'
    ];

    const status = document.getElementById('status');
    const button = document.getElementById('randomBtn');

    button.addEventListener('click', () => {
      const index = Math.floor(Math.random() * frases.length);
      status.textContent = frases[index];
    });
  </script>
</body>
</html>
